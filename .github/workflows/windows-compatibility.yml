name: Windows Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags:
      - "*"

concurrency:
  group: windows-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-language:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, csharp, go, java, python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.22"
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - uses: msys2/setup-msys2@v2
        if: matrix.language == 'cpp'
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW to PATH
        if: matrix.language == 'cpp'
        shell: pwsh
        run: '"C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install TypeScript dependencies
        if: matrix.language == 'typescript'
        run: npm ci
      - name: Verify track
        run: python scripts/automation.py verify-language --language ${{ matrix.language }}
